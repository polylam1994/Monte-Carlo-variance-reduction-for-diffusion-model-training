# Phase-2 pilot: tiny end-to-end check on CPU (minutes).
dataset: fmnist
data_root: data/fmnist
estimator: uniform
seed: 0
T: 1000
model: {ch: 16, mult: [1, 2], nres: 1, attn_lowest: false, dropout: 0.0}
batch: 64
lr: 2.0e-4
warmup: 20
clip: 1.0
ema: 0.99
hflip: false
steps: 60
eval_every: 30
log_every: 10
ckpt_every: 30
heldout_n: 256
probe_pool: 512
probe_at: [60]
probe_estimators: [uniform, antithetic, paired_iid, stratified, sobol, importance, is_strat, strat_anti]
probe_R: 8
decomp_at: [60]
decomp_bins: 5
decomp_reps: 1
threads: 4
out_dir: results/raw/pilot
