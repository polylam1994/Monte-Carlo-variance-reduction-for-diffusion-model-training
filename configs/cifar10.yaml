# CIFAR-10 main configuration (Kaggle GPU). Only `estimator` and `seed` vary between runs.
dataset: cifar10
data_root: data/cifar10
estimator: uniform
seed: 0
T: 1000
model: {ch: 32, mult: [1, 2, 2], nres: 2, attn_lowest: true, dropout: 0.0}
batch: 128
lr: 2.0e-4
warmup: 200
clip: 1.0
ema: 0.999
ema_warmup: true
hflip: true
amp: true
steps: 3000
eval_every: 250
log_every: 50
ckpt_every: 1000
heldout_n: 2000
probe_pool: 4096
probe_at: []          # set per run in the plan (uniform runs only)
probe_estimators: [uniform, antithetic, paired_iid, stratified, sobol, importance, is_strat, strat_anti]
probe_R: 48
decomp_at: []
decomp_bins: 20
decomp_reps: 3
fid_at: [1000, 2000, 3000]
fid_n: 10000
fid_batch: 1000
ddim_steps: 25
fid_noise_seed: 2024
out_dir: results/raw/cifar10
